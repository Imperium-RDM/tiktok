<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>imperiumcity.it • TikTok</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      text-align: center;
    }

    .container {
      width: 90%;
      max-width: 380px;
    }

    h1 {
      font-size: 26px;
      margin: 0 0 28px;
    }

    .button {
      display: block;
      width: 100%;
      padding: 16px;
      background: #fff;
      color: #000;
      border-radius: 12px;
      text-decoration: none;
      font-size: 17px;
      font-weight: bold;
      margin-bottom: 22px;
    }

    .warning {
      color: #ff3030;
      font-size: 14px;
      line-height: 1.5;
      margin: 0;
    }

    .username {
      display: inline-block;
      margin-top: 8px;
      color: #ff3030;
      font-weight: bold;
      cursor: pointer;
      text-decoration: underline;
    }

    #copied {
      display: block;
      margin-top: 8px;
      font-size: 12px;
      color: #888;
      opacity: 0;
      transition: opacity 0.2s;
    }

    #copied.show {
      opacity: 1;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>@imperiumcity.it</h1>

    <a
      class="button"
      href="https://www.tiktok.com/@imperiumcity.it"
    >
      Apri TikTok
    </a>

    <p class="warning">
      Se il pulsante non funziona,<br>
      cercateci su TikTok:
      <br>

      <span
        class="username"
        onclick="copyUsername()"
      >
        imperiumcity.it
      </span>

      <span id="copied">✓ Nome copiato</span>
    </p>

  </div>

  <script>
    function copyUsername() {
      navigator.clipboard.writeText("imperiumcity.it");

      const message = document.getElementById("copied");
      message.classList.add("show");

      setTimeout(() => {
        message.classList.remove("show");
      }, 1500);
    }
  </script>

</body>
</html>
